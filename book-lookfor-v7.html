function getBid(){
  var ctx = window.SRContext || {};
  var book = ctx.book || ctx || {};
  var u = String(ctx.bookUrl || book.bookUrl || book.url || ctx.url || '').trim();
  var mb = u.match(/data:bookId;base64,([A-Za-z0-9+/=]+)/);
  if (mb) { try { var dec=decodeURIComponent(escape(atob(mb[1]))); var mm=dec.match(/(\d{6,})/); if(mm) return mm[1]; } catch(e){} }
  var m = u.match(/\/(?:book)\/(\d+)/) || u.match(/[?&]bookId=(\d+)/) || u.match(/(\d{6,})/);
  if (m) return m[1];
  return '';
}

async function httpText(url, headers){
  try{
    if (window.SRNative && SRNative.http){
      var r = await SRNative.http(url, headers||null);
      if (typeof r === 'string') return r;
      if (r && typeof r === 'object'){
        if (typeof r.body === 'string') return r.body;
        if (typeof r.data === 'string') return r.data;
        if (typeof r.text === 'string') return r.text;
        if (typeof r.responseText === 'string') return r.responseText;
        try{ return JSON.stringify(r); }catch(e){}
      }
      if (r != null) return String(r);
    }
  }catch(e1){ return ''; }
  return '';
}
function mkHeaders(arr, ts){
  var qd = QDG_makeIOSQDSign(arr, ts);
  var qh = QDG_makeIOSQDH(ts);
  return { "user-agent":"QDReaderAppStore/5.9.474 (iPhone; iOS 15.2; Scale/3.00)", tstamp:String(ts), qdsign:qd, qdh:qh, accept:"application/json" };
}
function firstResolved(tasks){
  return new Promise(function(resolve,reject){
    var pending=tasks.length,done=false,last='';
    if(!pending){reject(new Error('无候选'));return}
    tasks.forEach(function(p){
      Promise.resolve(p).then(function(v){if(!done){done=true;resolve(v)}}).catch(function(e){
        last=String(e&&e.message||e);pending--;
        if(!done&&pending<=0)reject(new Error(last||'候选均失败'));
      });
    });
  });
}

function layout(){
  var deck=document.getElementById('deck'),cards=deck.querySelectorAll('.card');
  var cw=deck.clientWidth;
  cards.forEach(function(c){
    var r=c.getBoundingClientRect(),dr=deck.getBoundingClientRect();
    var center=r.left+r.width/2-(dr.left+dr.width/2);
    var ratio=Math.min(1,Math.abs(center)/(cw*0.55));
    var scale=1-0.11*ratio;
    c.style.transform='scale('+scale+') translateY('+(ratio*9)+'px)';
    c.style.opacity=String(1-0.25*Math.min(1,ratio*1.15));
    c.style.zIndex=String(Math.round(100-ratio*60));
  });
}
