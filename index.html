s = String(s==null?"":s);

var eh = String(bookEraHint||"").trim();

for (var i=0;i<bid.length;i++){ h ^= bid.charCodeAt(i); h = (h * 16777619)>>>0; }

}

// ===== bookId =====
function getBid(){
  var ctx = window.SRContext || {};
  var book = ctx.book || ctx || {};
  var u = String(ctx.bookUrl || book.bookUrl || book.url || ctx.url || '').trim();
  var mb = u.match(/data:bookId;base64,([A-Za-z0-9+/=]+)/);
  if (mb) { try { var dec=decodeURIComponent(escape(atob(mb[1]))); var mm=dec.match(/(\d{6,})/); if(mm) return mm[1]; } catch(e){} }
  var m = u.match(/\/(?:book)\/(\d+)/) || u.match(/[?&]bookId=(\d+)/) || u.match(/(\d{6,})/);
  if (m) return m[1];
  return '';
}

// ===== 请求 =====
async function httpText(url, headers){
  try{
    if (window.SRNative && SRNative.http){
      var r = await SRNative.http(url, headers||null);
      if (typeof r === 'string') return r;
      if (r && typeof r === 'object'){
        if (typeof r.body === 'string') return r.body;
        if (typeof r.data === 'string') return r.data;
        if (typeof r.text === 'string') return r.text;
        if (typeof r.responseText === 'string') return r.responseText;
        try{ return JSON.stringify(r); }catch(e){}
      }
      if (r != null) return String(r);
    }
  }catch(e1){ return ''; }
  return '';
}
function mkHeaders(arr, ts){
  var qd = QDG_makeIOSQDSign(arr, ts);
  var qh = QDG_makeIOSQDH(ts);
  return { "user-agent":"QDReaderAppStore/5.9.463 (iPhone; iOS 15.2; Scale/3.00)", tstamp:String(ts), qdsign:qd, qdh:qh, accept:"application/json" };
}

// ===== 状态 =====
var bid = getBid();
var page = 0, total = 0, loading = false, end = false;

// ===== 渲染(书源原版样式) =====
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function fmtLikes(n){ n=Number(n||0)||0; return n>=10000 ? (Math.round(n/1000)/10+"万") : String(n); }
function renderItems(items){
  var box = document.getElementById('list');
  for (var i=0;i<items.length;i++){
    var it = items[i]||{};
    var nm = String(it.RoleName||"").trim();
    if(!nm) continue;
    var av = String(it.RoleHeadIcon||"").trim();
    if(av.indexOf("//")===0) av="https:"+av;
    var likes = Number(it.Likes||0)||0;
    var tags = (it.TagList||[]).slice(0,6).map(function(t){return String(t.TagName||"").trim();}).filter(Boolean);
    var pos = String(it.Position||"");
    var el = document.createElement('a');
    el.className='item';
    el.href='javascript:void(0)';
    el.setAttribute('data-role-id',String(it.RoleId||''));
    el.setAttribute('data-role-name',nm);
    var h = '';
    h += '<div class="ava">' + (av ? '<img src="'+esc(av)+'" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : '<div class="avaPh"></div>') + '</div>';
    h += '<div class="mid">';
    h += '<div class="line1"><div class="name">' + esc(nm) + '</div>' + (pos ? ('<div class="meta">['+esc(pos)+']</div>') : '') + '</div>';
    h += '<div class="desc">' + (tags.length ? esc(tags.join(' / ')) : '') + '</div>';
    h += '</div>';
    h += '<div class="side" data-likes="'+likes+'" data-liked="0"><button type="button" class="heart" aria-label="点赞"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.001 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg></button><span class="likeNum">'+fmtLikes(likes)+'</span></div>';
    el.innerHTML = h;
    box.appendChild(el);
  }
}

// ===== 加载(直接进列表,无加载页) =====
async function loadMore(){
  if(loading||end||!bid) return;
  loading=true;
  page++;
  try{
    var arr=["bookId="+bid,"count=20","page="+page];
    var ts=Date.now();
    var url="https://magev6.if.qidian.com/argus/api/v1/bookrole/getroleinfolist?bookId="+bid+"&count=20&page="+page;
    var txt=await httpText(url,mkHeaders(arr,ts));
    txt=String(txt||"").replace(/"RoleId"\s*:\s*(\d+)/g,'"RoleId":"$1"');
    var j=JSON.parse(txt||"{}");
    if(j.Result!==0){ loading=false; return; }
    var data=j.Data||{};
    total=Number(data.TotalCount||0);
    var items=data.Items||[];
    renderItems(items);
    if(items.length<20 || page*20>=total) end=true;
  }catch(e){ loading=false; }
  loading=false;
}



// ===== 角色卡：用详情接口验证RoleId候选 =====
function roleHttps(u){u=String(u||'').trim();return u.indexOf('http://')===0?'https://'+u.slice(7):u;}
function roleIdCandidates(rounded){
  var out=[];
  try{
    var s=String(rounded||'').trim();
    var base=BigInt(s);
    var abs=base<0n?-base:base;
    var bits=abs.toString(2).length;
    // IEEE-754 Number在该数量级的步长：2^(指数-52)=2^(bits-53)
    var radius=bits>53 ? (1n<<BigInt(bits-53)) : 1n;
    // 覆盖四舍五入、截断等转换；范围随RoleId数量级变化
    for(var d=-radius;d<=radius;d++)out.push(String(base+d));
  }catch(e){out.push(String(rounded||''));}
  return out;
}
async function getRoleDetail(bookId,roundedRoleId,expectedName){
  bookId=String(bookId||'');
  expectedName=String(expectedName||'');
  var candidates=roleIdCandidates(roundedRoleId);
  var jobs=candidates.map(function(roleId){
    return (async function(){
      var arr=['bookId='+bookId,'roleId='+roleId];
      var ts=Date.now();
      var url='https://magev6.if.qidian.com/argus/api/v1/bookrole/v2/getroledetails?bookId='+encodeURIComponent(bookId)+'&roleId='+encodeURIComponent(roleId);
      var txt=await httpText(url,mkHeaders(arr,ts));
      var j=JSON.parse(String(txt||'{}'));
      var d=j.Data||{};
      if(Number(j.Result)!==0 || !d.RoleName)return null;
      if(expectedName && String(d.RoleName)!==expectedName)return null;
      var tags=((d.TagInfo&&d.TagInfo.Items)||[]).map(function(t){return {TagName:t.TagName,Name:t.TagName,Likes:t.Likes};});
      var dub=d.RoleSpokesManData||null;
      return {RoleName:String(d.RoleName||''),RoleId:roleId,__roleId:roleId,Position:String(d.Position||''),RoleDesc:String(d.Description||''),Likes:d.Likes||0,Sex:d.Sex,RoleHeadIcon:roleHttps(d.RoleHeadMap||d.RoleHeadImage||''),RoleBackGroundImage:roleHttps(d.RoleHeadImage||''),TagList:tags,TopDubbing:(dub&&dub.AudioUrl)?{AudioUrl:roleHttps(dub.AudioUrl),AudioTime:0,RefferContent:''}:null};
    })().catch(function(){return null;});
  });
  var results=await Promise.all(jobs);
  for(var i=0;i<results.length;i++)if(results[i])return results[i];
  throw new Error('所有RoleId候选均失败');
}
function openRoleCard(url){
  var ov=document.getElementById('roleOverlay'),fr=document.getElementById('roleFrame'),ld=document.getElementById('roleLoading');
  if(!ov||!fr)return;ov.classList.add('show');if(ld){ld.style.display='flex';ld.textContent='正在打开角色卡…';}
  fr.onload=function(){if(ld)ld.style.display='none';};fr.src=url;
}
function closeRoleCard(){var ov=document.getElementById('roleOverlay'),fr=document.getElementById('roleFrame');if(ov)ov.classList.remove('show');if(fr)try{fr.removeAttribute('src');}catch(e){}}
async function openRoleItem(el){
  var rid=String(el.getAttribute('data-role-id')||'').trim();if(!rid)return;
  var ld=document.getElementById('roleLoading');if(ld){ld.style.display='flex';ld.textContent='正在打开角色卡…';}
  try{var role=await getRoleDetail(bid,rid,el.getAttribute('data-role-name')||'');openRoleCard('data:text/html;base64,'+roleB64(roleCardHtml(role,bid,'')));}
  catch(e){if(ld)ld.textContent='角色卡加载失败：'+String(e&&e.message||e);}
}
document.addEventListener('click',function(ev){
  var t=ev.target;
  if(t&&t.closest&&t.closest('.heart'))return;
  var item=t&&t.closest?t.closest('.item'):null;
  if(!item)return;ev.preventDefault();openRoleItem(item);
},false);
var roleOverlay=document.getElementById('roleOverlay');
if(roleOverlay)roleOverlay.addEventListener('click',function(ev){if(ev.target===roleOverlay)closeRoleCard();},false);
window.addEventListener('message',function(ev){if((ev.data||{}).type==='qdroleclose')closeRoleCard();},false);

// ===== 点赞交互:全局事件委托(点击红心变红+数字+1) =====
document.addEventListener('click', function(ev){
  var t = ev.target;
  while (t && t !== document && !(t.classList && t.classList.contains('heart'))) t = t.parentNode;
  if (!t || t === document) return;
  ev.preventDefault(); ev.stopPropagation();
  var side = t.closest('.side');
  if (!side) return;
  var liked = side.getAttribute('data-liked') === '1';
  liked = !liked;
  side.setAttribute('data-liked', liked ? '1' : '0');
  var base = Number(side.getAttribute('data-likes') || 0) || 0;
  var num = side.querySelector('.likeNum');
  if (liked) t.classList.add('liked'); else t.classList.remove('liked');
  if (num) num.textContent = fmtLikes(base + (liked ? 1 : 0));
}, true);

// ===== 滚动加载 =====
(function(){
  if(!bid) return;
  var box=document.querySelector('.page')||document.body;
  function onScroll(){
    var wrap=document.querySelector('.wrap');
    if(!wrap) return;
    var r=wrap.getBoundingClientRect();
    if(r.bottom < (window.innerHeight||document.documentElement.clientHeight) + 300) loadMore();
  }
  box.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll, {passive:true});
  loadMore();
})();
