function getBid(){
  var ctx = window.SRContext || {};
  var book = ctx.book || ctx || {};
  var u = String(ctx.bookUrl || book.bookUrl || book.url || ctx.url || '').trim();
  var mb = u.match(/data:bookId;base64,([A-Za-z0-9+/=]+)/);
  if (mb) { try { var dec=decodeURIComponent(escape(atob(mb[1]))); var mm=dec.match(/(\d{6,})/); if(mm) return mm[1]; } catch(e){} }
  var m = u.match(/\/(?:book)\/(\d+)/) || u.match(/[?&]bookId=(\d+)/) || u.match(/(\d{6,})/);
  if (m) return m[1];
  return '';
}

      var r = await SRNative.http(url, headers||null);

        if (typeof r.body === 'string') return r.body;

}

(function(){
