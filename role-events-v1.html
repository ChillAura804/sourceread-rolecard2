        var j=JSON.parse(String(t||'{}')),d=j.Data||{};
        if(Number(j.Result)!==0||String(d.RoleName||'')!==String(expectedName||'')){failed();return;}

}
async function choose(el){
  if(!el||loading)return;
  Array.prototype.forEach.call(document.querySelectorAll('.role'),function(x){x.classList.remove('on')});el.classList.add('on');
  var roundedId=String(el.dataset.id||''),name=String(el.dataset.name||'');

function pickList(d){if(Array.isArray(d))return d;if(!d||typeof d!=='object')return[];var ks=['Items','Stories','StoryList','List','DataList','Records','EventList'];for(var i=0;i<ks.length;i++)if(Array.isArray(d[ks[i]]))return d[ks[i]];for(var k in d)if(Array.isArray(d[k])&&d[k].length&&typeof d[k][0]==='object')return d[k];return[]}
function field(o,n){for(var i=0;i<n.length;i++)if(o&&o[n[i]]!=null&&o[n[i]]!=='')return o[n[i]];return ''}
function render(list){var box=$('#events');if(!list.length&&page===1){state('该角色暂无大事件');return}list.forEach(function(x){var title=field(x,['Title','StoryTitle','ChapterName','EventTitle','Name'])||selected.name+' 的事件';var text=field(x,['Content','StoryContent','Description','Desc','Text','Summary']);var ch=field(x,['ChapterName','ChapterTitle','ChapterId','ChapterIndex']);var el=document.createElement('article');el.className='event';el.innerHTML='<div class="eventCard"><div class="eventTitle">'+esc(title)+'</div>'+(text?'<div class="eventText">'+esc(text)+'</div>':'')+(ch?'<div class="meta">'+esc(ch)+'</div>':'')+'</div>';box.appendChild(el)})}
async function loadMore(){
  if(loading||end||!selected)return;loading=true;page++;
  var a=['bookId='+bid,'pageIndex='+page,'pageSize=20','roleId='+selected.id],ts=Date.now(),u='https://magev6.if.qidian.com/argus/api/v1/bookrole/storiesdetail?bookId='+encodeURIComponent(bid)+'&pageIndex='+page+'&pageSize=20&roleId='+encodeURIComponent(selected.id),t='';
  if(page===1)state('正在请求 '+selected.name+' 的大事件…');
  try{t=await httpText(u,mkHeaders(a,ts));var j=JSON.parse(t),d=j.Data||{};if(Number(j.Result)!==0)throw new Error(j.Message||'接口返回失败');var list=pickList(d);if(page===1)$('#events').innerHTML='';render(list);end=list.length<20;$('#more').classList.toggle('show',!end)}
  catch(e){if(page===1)state('大事件请求失败');debug('精确 roleId='+selected.id+'\nURL='+u+'\n错误='+String(e)+'\n原始返回='+String(t).slice(0,3000));page--}
  loading=false;
}
