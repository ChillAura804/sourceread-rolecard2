.top .sub{font-size:12px;color:var(--sub);margin-top:3px;}

.card-noimg{width:100%;height:52%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.card-noimg .big{font-size:44px;font-weight:800;color:var(--primary);opacity:.85;}
.card-body{flex:1 1 auto;display:flex;flex-direction:column;padding:14px 16px 13px;min-height:0;}
.card-title{font-size:17px;font-weight:800;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-sub{font-size:12px;color:var(--sub);margin-top:6px;}
.card-desc{font-size:12.5px;line-height:1.6;color:var(--sub);margin-top:9px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:0;}
.card-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:9px;}
.foot-ava{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:0 0 26px;}
.foot-name{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;}
.foot-stat{font-size:11px;color:var(--sub);display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;}
.foot-stat svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}

.hint{position:absolute;left:0;right:0;bottom:calc(var(--safeBottom) + 8px);text-align:center;font-size:11px;color:var(--sub);pointer-events:none;}

  if(m)return m[1];return '';
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function txt(s){return String(s==null?'':s).trim()}
function show(error){document.getElementById('deck').outerHTML='<div class="state">'+esc(error||'')+'</div>'}
function cardIcon(){
  return '<svg viewBox="0 0 24 24" width="13" height="13"><path d="M7 21V10.2L12.2 3c.9 0 1.7.8 1.7 1.8L13 9.2h6.1c1.1 0 2 .9 1.8 2l-1.4 8c-.1.9-.9 1.6-1.8 1.6H7zM7 21H4.5c-.8 0-1.5-.7-1.5-1.5v-7.8c0-.8.7-1.5 1.5-1.5H7"/></svg>';
}
function bookCover(x){
  var img=String(x.Image||'');
  if(img)return '<img class="card-img" src="'+esc(img)+'" loading="lazy" referrerpolicy="no-referrer"><span class="badge">'+esc(x.ModelName||'看点')+'</span>';
  var t=txt(x.Title||x.SubTitle||'看');
  return '<div class="card-noimg"><span class="big">'+esc(t.charAt(0))+'</span><span class="badge">'+esc(x.ModelName||'看点')+'</span></div>';
}
function cardHtml(x){
  var title=txt(x.Title||x.SubTitle||''),sub=txt(x.SubTitle&&x.SubTitle!==x.Title?x.SubTitle:''),body=txt(x.Body||'');
  var name=txt(x.UserName),ava=txt(x.UserHeadIcon),like=Number(x.LikeCount||0)||0,total=Number(x.TotalCount||0)||0;
  var stat='';
  if(total)stat+='<span class="foot-stat"><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z"/></svg>'+total+' 本</span>';
  if(like)stat+='<span class="foot-stat">'+cardIcon()+'<span>'+like+'</span></span>';
  return '<article class="card">'+bookCover(x)+
    '<div class="card-body"><div class="card-title">'+esc(title)+'</div>'+
    (sub?'<div class="card-sub">'+esc(sub)+'</div>':'')+
    (body?'<div class="card-desc">'+esc(body).replace(/\n/g,' ')+'</div>':'')+
    '<div class="card-foot">'+(ava?'<img class="foot-ava" src="'+esc(ava)+'" loading="lazy" referrerpolicy="no-referrer">':'')+
    '<span class="foot-name">'+esc(name||'')+'</span>'+stat+'</div></div></article>';
}
function layout(){
  var deck=document.getElementById('deck'),cards=deck.querySelectorAll('.card');
  var cw=deck.clientWidth;
  cards.forEach(function(c){
    var r=c.getBoundingClientRect(),dr=deck.getBoundingClientRect();
    var center=r.left+r.width/2-(dr.left+dr.width/2);
    var ratio=Math.min(1,Math.abs(center)/(cw*0.55));
    var scale=1-0.11*ratio;
    c.style.transform='scale('+scale+') translateY('+(ratio*9)+'px)';
    c.style.opacity=String(1-0.25*Math.min(1,ratio*1.15));
    c.style.zIndex=String(Math.round(100-ratio*60));
  });
}
function bindDeck(){
  var deck=document.getElementById('deck');
  deck.addEventListener('scroll',layout,{passive:true});
  requestAnimationFrame(layout);
}
async function init(){
  document.getElementById('bookName').textContent='本书看点';
  if(!bid){show('未获取到 bookId；请从书籍详情页或阅读页启动');return}
  var a=['bookId='+bid,'cbid=-1','isOutBook=0'],ts=Date.now();
  var u='https://magev6.if.qidian.com/argus/api/v3/bookdetail/lookfor?'+a.join('&');
  var raw=await httpText(u,mkHeaders(a,ts)),j=QDG_safeJson(raw)||{};
  if(Number(j.Result)!==0)throw new Error(txt(j.Message)||'lookfor 请求失败 Result='+j.Result);
  var list=Array.isArray(j.Data&&j.Data.BookLookForDetail)?j.Data.BookLookForDetail:[];
  looks=list.filter(function(x){return Number(x.ModelType)!==3&&!/(人气角色)/.test(txt(x.ModelName))});
  var deck=document.getElementById('deck');
  var bn=document.getElementById('bookName');
  if(bn&&txt((j.Data||{}).BookId))bn.textContent='本书看点';
  if(!looks.length){show('暂无看点内容');return}
  deck.innerHTML=looks.map(cardHtml).join('');
  var ct=document.getElementById('countText');if(ct)ct.textContent=looks.length+' 个看点';
  bindDeck();
}
var closeBtn=document.getElementById('closeBtn');
if(closeBtn)closeBtn.onclick=function(){if(window.SRNative&&SRNative.dismiss){SRNative.dismiss()}else{window.close()}};
init().catch(function(e){show('看点加载失败\n'+String(e&&e.message||e))});
</script></body></html>
