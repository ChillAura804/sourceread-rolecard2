  var u = String(ctx.bookUrl || book.bookUrl || book.url || ctx.url || '').trim();
  var mb = u.match(/data:bookId;base64,([A-Za-z0-9+/=]+)/);

}

    listCache=reset?page.slice():listCache.concat(page);

    var u='https://magev6.if.qidian.com/argus/api/v1/booklist/getBookListDetail?'+a.join('&');
    var raw=await httpText(u,mkHeaders(a,ts)),j=QDG_safeJson(raw)||{};
    if(Number(j.Result)!==0)throw new Error(txt(j.Message)||'Result='+j.Result);
    var arr=Array.isArray(j.Data&&j.Data.Books)?j.Data.Books:[],head=detailHtml(j.Data||fallback||{});
    sheetBg(document.getElementById('detailBg'),bookCoverUrl());
    var list='<div class="dtsub">收录书籍</div>'+(arr.length?arr.map(bookCardHtml).join(''):'<div class="state">暂无收录书籍</div>');
    document.getElementById('detailBox').innerHTML=head+list;
  }catch(e){
    document.getElementById('detailBox').innerHTML='<div class="state">书单详情加载失败<br><span style="font-size:11px">'+esc(String(e&&e.message||e))+'</span></div>';
  }
}
function showCardDetail(i){var x=looks[i];if(x)showDetailById(x.Id||x.IdStr,x)}
function closePanel(id){var p=document.getElementById(id);if(p)p.classList.remove('on')}
function bindClicks2(){
  var lb=document.getElementById('listBox');
  if(lb)lb.addEventListener('scroll',function(){if(lb.scrollTop+lb.clientHeight>=lb.scrollHeight-300&&!listEnd&&!listLoading){listPg++;loadList(false)}},{passive:true});
}

function bindClicks(){
  document.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('[data-back]'):null;if(b){closePanel(b.getAttribute('data-back'));return}
    var role=e.target&&e.target.closest?e.target.closest('[data-role]'):null;if(role)return;
    var dt=e.target&&e.target.closest?e.target.closest('[data-detail]'):null;if(dt){showCardDetail(Number(dt.getAttribute('data-detail'))||0);return}
    var al=e.target&&e.target.closest?e.target.closest('[data-all]'):null;if(al){listLoading=false;loadList(true);return}
    var more=e.target&&e.target.closest?e.target.closest('[data-more]'):null;
    if(more){var i=Number(more.getAttribute('data-more'))||0;var box=document.getElementById('ld-'+i);
      if(box){box.classList.toggle('open');more.textContent=box.classList.contains('open')?'收起':'展开'}return}
    var it=e.target&&e.target.closest?e.target.closest('.list-item'):null;if(it&&it.getAttribute('data-blid'))showDetailById(it.getAttribute('data-blid'),null);

  });
}
function layout(){
  var deck=document.getElementById('deck'),cards=deck.querySelectorAll('.card');
  var cw=deck.clientWidth;
  cards.forEach(function(c){
    var r=c.getBoundingClientRect(),dr=deck.getBoundingClientRect();
    var center=r.left+r.width/2-(dr.left+dr.width/2);
    var ratio=Math.min(1,Math.abs(center)/(cw*0.55));
    var scale=1-0.11*ratio;
    c.style.transform='scale('+scale+') translateY('+(ratio*9)+'px)';
    c.style.opacity=String(1-0.25*Math.min(1,ratio*1.15));
    c.style.zIndex=String(Math.round(100-ratio*60));
  });
}
function bindDeck(){
  var deck=document.getElementById('deck');
  deck.addEventListener('scroll',layout,{passive:true});
  requestAnimationFrame(layout);
}
async function init(){
  if(!bid){show('未获取到 bookId；请从书籍详情页或阅读页启动');return}
  var a=['bookId='+bid,'cbid=-1','isOutBook=0'],ts=Date.now();
  var u='https://magev6.if.qidian.com/argus/api/v3/bookdetail/lookfor?'+a.join('&');
  var raw=await httpText(u,mkHeaders(a,ts)),j=QDG_safeJson(raw)||{};
  if(Number(j.Result)!==0)throw new Error(txt(j.Message)||'lookfor 请求失败 Result='+j.Result);
  var list=Array.isArray(j.Data&&j.Data.BookLookForDetail)?j.Data.BookLookForDetail:[];
  looks=list.filter(function(x){return Number(x.ModelType)===1||Number(x.ModelType)===3});
  var deck=document.getElementById('deck');
  var page=document.querySelector('.page');if(page){var hc=bookCoverUrl();if(hc)page.style.setProperty('--page-bg','url(\"'+hc+'\")')}
  if(!looks.length){show('暂无看点内容');return}
  deck.innerHTML=looks.map(function(x){return Number(x.ModelType)===3?roleCardHtml(x):cardHtml(x)}).join('');
  var ct=document.getElementById('countText');if(ct)ct.textContent=looks.length+' 个看点';
  bindDeck();bindClicks();bindClicks2();
}
init().catch(function(e){show('看点加载失败\n'+String(e&&e.message||e))});
</script></body></html>
